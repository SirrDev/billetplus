name: Backend CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: billetplus
          POSTGRES_USER: billetplus
          POSTGRES_PASSWORD: billetplus_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billetplus -d billetplus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurer JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Rendre mvnw exécutable
        run: chmod +x backend/mvnw

      - name: Compiler et tester
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/billetplus
          SPRING_DATASOURCE_USERNAME: billetplus
          SPRING_DATASOURCE_PASSWORD: billetplus_dev
          SPRING_DATA_REDIS_HOST: localhost
        run: ./mvnw clean verify

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7
