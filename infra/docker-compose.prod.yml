# Déploiement de référence de Billet+ sur UNE machine (événement pilote).
#
# Depuis la racine du dépôt, après avoir créé infra/.env.prod (modèle :
# infra/.env.prod.example) et déposé les deux clés Ed25519 dans infra/secrets/ :
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
#
# Le TLS (HTTPS) est assuré par un proxy sur la machine (Caddy, nginx), qui
# transmet à 127.0.0.1:8080 et REMPLACE l'en-tête X-Forwarded-For par l'adresse
# du client (nginx : proxy_set_header X-Forwarded-For $remote_addr;).
# PostgreSQL et Redis ne sont publiés sur aucun port : seul le backend les joint,
# par le réseau interne de Compose.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # - requirepass : Redis porte les réservations de places, il ne doit pas être ouvert ;
    # - noeviction : mémoire pleine, Redis refuse d'écrire au lieu d'effacer des
    #   réservations sans prévenir (VerificationProduction refuse de démarrer sinon) ;
    # - appendonly : les réservations survivent à un redémarrage de Redis.
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Passerelle de paiement (ADR 0007) : la clé signe aussi les webhooks.
      UNITECHPAY_API_KEY: ${UNITECHPAY_API_KEY}
      UNITECHPAY_URL_RETOUR_SUCCES: ${UNITECHPAY_URL_RETOUR_SUCCES:-}
      UNITECHPAY_URL_RETOUR_ANNULATION: ${UNITECHPAY_URL_RETOUR_ANNULATION:-}
      QR_PRIVATE_KEY_PATH: file:/run/secrets/ed25519_private.pem
      QR_PUBLIC_KEY_PATH: file:/run/secrets/ed25519_public.pem
      BILLETPLUS_ADMIN_EMAIL: ${BILLETPLUS_ADMIN_EMAIL:-}
      BILLETPLUS_ADMIN_MOT_DE_PASSE: ${BILLETPLUS_ADMIN_MOT_DE_PASSE:-}
    volumes:
      # Lecture seule : l'application lit les clés, ne les modifie jamais.
      - ./secrets:/run/secrets:ro
    ports:
      # Boucle locale seulement : le proxy TLS est le seul point d'entrée public.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres_data:
  redis_data:
