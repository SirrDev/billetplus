# Infrastructure de développement local de Billet+ (PostgreSQL/PostGIS + Redis).
#
# À lancer depuis la RACINE du dépôt :
#   docker compose -f infra/docker-compose.yml up -d
#
# La clé « version » est volontairement absente : obsolète avec Compose v2,
# qui l'ignore et affiche un avertissement à chaque commande.

services:
  postgres:
    # Image PostGIS, et non postgres:16 : V1__enable_extensions.sql exécute
    # CREATE EXTENSION postgis, absente de l'image standard (voir ADR 0003).
    # Après un changement d'image, supprimer aussi le volume :
    #   docker compose -f infra/docker-compose.yml down -v
    image: postgis/postgis:16-3.4
    container_name: billetplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billetplus
      POSTGRES_USER: billetplus
      POSTGRES_PASSWORD: billetplus_dev
    ports:
      # Format "IP:HÔTE:CONTENEUR" : PostgreSQL écoute toujours sur 5432 dans le conteneur.
      # Publié sur 127.0.0.1 seulement : le mot de passe de dev ci-dessus est
      # public (commité). Exposé sur toutes les interfaces, n'importe qui sur le
      # réseau local (Wi-Fi public, réseau partagé) pourrait lire ou modifier la
      # base. Le backend lancé sur le poste s'y connecte par localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billetplus -d billetplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: billetplus-redis
    restart: unless-stopped
    ports:
      # Publié sur 127.0.0.1 seulement : Redis n'a pas de mot de passe, et il
      # porte les réservations temporaires de places (état critique pour la
      # vente). Exposé sur toutes les interfaces, n'importe qui sur le réseau
      # local pourrait tout libérer (FLUSHALL) ou tout bloquer. Le backend lancé
      # sur le poste s'y connecte par localhost, sans changement.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # En dev, le backend se lance avec .\mvnw spring-boot:run depuis backend/.
  # backend/Dockerfile produit l'image de PRODUCTION (profil prod, secrets
  # obligatoires) : pour la lancer, voir infra/docker-compose.prod.yml. Ce bloc
  # ne fonctionnerait qu'en ajoutant SPRING_PROFILES_ACTIVE: default.
  # backend:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: billetplus-backend
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billetplus
  #     SPRING_DATASOURCE_USERNAME: billetplus
  #     SPRING_DATASOURCE_PASSWORD: billetplus_dev
  #     # Spring Boot 3 : spring.data.redis.host (l'ancien spring.redis.host est ignoré)
  #     SPRING_DATA_REDIS_HOST: redis
  #   ports:
  #     # Si 8080 est occupé sur le poste, remapper (ex. "8081:8080").
  #     - "8080:8080"

  # Décommenter une fois web/Dockerfile.dev créé. Revoir VITE_API_URL à ce
  # moment-là : le port 8080 est souvent occupé en local.
  # web:
  #   build:
  #     context: ../web
  #     dockerfile: Dockerfile.dev
  #   container_name: billetplus-web
  #   ports:
  #     - "5173:5173"
  #   environment:
  #     VITE_API_URL: http://localhost:8080

volumes:
  postgres_data:
