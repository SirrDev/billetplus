  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/billetplus
  #     SPRING_DATASOURCE_USERNAME: billetplus
  #     SPRING_DATASOURCE_PASSWORD: billetplus_dev
