version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: billetplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billetplus
      POSTGRES_USER: billetplus
      POSTGRES_PASSWORD: billetplus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billetplus -d billetplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: billetplus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Décommenter une fois le squelette Spring Boot en place (feature/backend-bootstrap)
