spring:
  application:
    name: billetplus-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/billetplus
    username: billetplus
    password: billetplus_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schéma est intégralement piloté par Flyway — Hibernate ne fait que
      # vérifier la cohérence des entités avec le schéma existant.
      # Voir docs/architecture/adr/0003-postgresql-vs-nosql.md
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      # Redis est utilisé par scripts (StringRedisTemplate), jamais par
      # repositories Spring Data : sans cela, Spring cherche des repositories
      # Redis, trouve nos interfaces JPA et affiche « Could not safely identify
      # store assignment » à chaque démarrage.
      repositories:
        enabled: false

server:
  port: 8080

# Clés Ed25519 pour la signature des QR codes de billets — voir ADR 0004.
# La clé privée ne doit JAMAIS être commitée : injectée via variable d'environnement
# en production (infra/scripts/generate-ed25519-keys.sh pour le développement local).
billetplus:
  security:
    jwt:
      secret: ${JWT_SECRET:changeme_dev_only_never_use_in_prod}
      expiration-minutes: 15
      refresh-expiration-days: 7
    qr-signing:
      private-key-path: ${QR_PRIVATE_KEY_PATH:classpath:keys/ed25519_private_dev.pem}
      # Paramétrable comme la clé privée : en production, les DEUX clés viennent de
      # fichiers montés hors de l'image (Ed25519Config vérifie qu'elles forment une paire).
      public-key-path: ${QR_PUBLIC_KEY_PATH:classpath:keys/ed25519_public.pem}
  # Premier compte ADMIN, créé au démarrage s'il n'en existe aucun
  # (PremierAdminInitializer). Jamais de valeur ici : uniquement par variables
  # d'environnement. Vides, rien n'est créé (cas normal en dev et en CI).
  admin:
    email: ${BILLETPLUS_ADMIN_EMAIL:}
    mot-de-passe: ${BILLETPLUS_ADMIN_MOT_DE_PASSE:}
  # Réservation temporaire des places pendant le paiement Wave (ADR 0003).
  # Plus longue que le tunnel de paiement (1 à 2 minutes) : trop courte, elle
  # expirerait pendant un paiement en cours.
  reservation:
    duree: 5m
  # Commission de Billet+ (ADR 0009), en points de base : 500 = 5 %. Recopiée dans chaque
  # commande à sa création : la changer ne modifie aucune vente passée.
  commission:
    taux-points-base: 500
  # Commandes sans compte (ADR 0006). Le délai de paiement doit rester strictement
  # inférieur à reservation.duree (vérifié au démarrage par CreateOrderUseCase) :
  # la marge absorbe la latence du webhook Wave.
  commande:
    delai-paiement: 4m
    max-en-attente-par-telephone: 3
  # Passerelle de paiement UnitechPay (ADR 0007). La clé d'API est aussi le secret
  # HMAC des webhooks : jamais de valeur ici, uniquement UNITECHPAY_API_KEY. Vide
  # (dev, CI), toute ouverture de paiement répond 503.
  paiement:
    # Pas de paiement ouvert à moins de 60 s de l'expiration de la commande : il
    # aboutirait presque sûrement après l'expiration des places.
    marge-minimale: 60s
    unitechpay:
      url-api: https://api.unitech.sn
      cle-api: ${UNITECHPAY_API_KEY:}
      # Pages de la PWA après le paiement ; {orderId} est remplacé. Vides : non envoyées.
      url-retour-succes: ${UNITECHPAY_URL_RETOUR_SUCCES:}
      url-retour-annulation: ${UNITECHPAY_URL_RETOUR_ANNULATION:}
  # Limitation de débit (shared.limitation). Fenêtres fixes ; clé IP ou COMPTE
  # (compte authentifié, à défaut l'IP). Au-delà : 429 avec Retry-After.
  # Attention au NAT des opérateurs mobiles : beaucoup d'acheteurs peuvent partager
  # une même IP publique. Les limites par IP restent donc larges, et freinent un
  # script plutôt qu'un acheteur.
  limitation:
    active: true
    regles:
      - { nom: creation-commande,  methode: POST, chemin: /api/orders,             cle: IP,     limite: 20,  fenetre: 1m }
      - { nom: lecture-commande,   methode: GET,  chemin: /api/orders/*,           cle: IP,     limite: 120, fenetre: 1m }
      - { nom: ouverture-paiement, methode: POST, chemin: /api/orders/*/paiement,  cle: IP,     limite: 20,  fenetre: 1m }
      - { nom: lecture-billets,    methode: GET,  chemin: /api/orders/*/billets,   cle: IP,     limite: 60,  fenetre: 1m }
      - { nom: connexion,          methode: POST, chemin: /api/auth/login,         cle: IP,     limite: 10,  fenetre: 1m }
      - { nom: inscription,        methode: POST, chemin: /api/auth/register,      cle: IP,     limite: 5,   fenetre: 10m }
      - { nom: rafraichissement,   methode: POST, chemin: /api/auth/refresh,       cle: IP,     limite: 30,  fenetre: 1m }
      - { nom: scan,               methode: POST, chemin: /api/events/*/scans,     cle: COMPTE, limite: 120, fenetre: 1m }
      - { nom: creation-agent,     methode: POST, chemin: /api/agents,             cle: COMPTE, limite: 30,  fenetre: 1h }
      # Modifier un agent répond 400 si l'e-mail est déjà pris : sans limite, un compte
      # organisateur (inscription libre) testerait des e-mails à volonté.
      - { nom: modification-agent, methode: PUT,  chemin: /api/agents/*,           cle: COMPTE, limite: 30,  fenetre: 1h }
      - { nom: retrait-agent,      methode: DELETE, chemin: /api/agents/*,         cle: COMPTE, limite: 30,  fenetre: 1h }
      - { nom: evenements-affectes, methode: GET, chemin: /api/events/affectes,    cle: COMPTE, limite: 60,  fenetre: 1m }
      - { nom: transfert-billet,   methode: POST, chemin: /api/orders/*/billets/*/transfert, cle: IP, limite: 10, fenetre: 10m }
      - { nom: billet-recu,        methode: POST, chemin: /api/billets/*/consultation, cle: IP, limite: 30, fenetre: 10m }
      - { nom: changement-mot-de-passe, methode: POST, chemin: /api/auth/mot-de-passe, cle: COMPTE, limite: 5, fenetre: 15m }
      - { nom: modification-evenement, methode: PUT, chemin: /api/events/*,        cle: COMPTE, limite: 60,  fenetre: 1m }
      # Chaque nouvelle position crée une ligne venues (copie du lieu, voir EventService) :
      # « * » ne couvre qu'un segment, la règle ci-dessus ne s'applique donc pas ici.
      - { nom: position-evenement, methode: PUT,  chemin: /api/events/*/position,  cle: COMPTE, limite: 30,  fenetre: 1h }

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Seule la sonde de santé est exposée (/actuator/health, publique dans
# SecurityConfig), sans détail : elle vérifie PostgreSQL et Redis, et sert de
# sonde au conteneur et au proxy. Aucun autre endpoint actuator n'est publié.
management:
  endpoints:
    web:
      exposure:
        include: health
      # Pas de page /actuator listant les endpoints exposés.
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.billetplus: DEBUG
    org.hibernate.SQL: DEBUG

---
# Profil de production (SPRING_PROFILES_ACTIVE=prod). Chaque secret est une
# variable d'environnement SANS valeur par défaut : absente, l'application refuse
# de démarrer au lieu de retomber sur une valeur de dev. VerificationProduction
# ajoute les contrôles que Spring ne fait pas (secret JWT de dev, clés du
# classpath, Redis sans noeviction). Liste des variables : infra/.env.prod.example.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      data-source-properties:
        # Pilote PostgreSQL : sans le détail du serveur (« Key (email)=(...) already exists »,
        # « Failing row contains (...) »), les messages d'erreur SQL journalisés par Hibernate
        # ne recopient plus les valeurs saisies (e-mails, numéros). Le nom de la contrainte
        # reste dans le message : JpaUserRepositoryAdapter le reconnaît toujours.
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    # Jamais de « baseline » silencieuse en production : une base non vide sans
    # historique Flyway doit arrêter le démarrage, pas être déclarée à jour.
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

server:
  port: 8080
  # Derrière le proxy (TLS), l'adresse du client vient de X-Forwarded-For, que
  # Tomcat (RemoteIpValve) ne lit QUE si la connexion vient d'un proxy de confiance
  # (adresses privées par défaut : réseau Docker, réseau local). Un client
  # exposé directement ne peut donc pas choisir son IP. Indispensable à la
  # limitation de débit par IP (shared.limitation).
  forward-headers-strategy: native
  # Proxies de confiance : valeur par défaut de Tomcat (adresses privées, dont les
  # réseaux Docker, et boucle locale). Si le proxy a une adresse publique, la
  # déclarer par la variable SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES (expression régulière).
  error:
    include-message: never
    include-stacktrace: never

billetplus:
  security:
    jwt:
      secret: ${JWT_SECRET}
    qr-signing:
      private-key-path: ${QR_PRIVATE_KEY_PATH}
      public-key-path: ${QR_PUBLIC_KEY_PATH}
  paiement:
    unitechpay:
      cle-api: ${UNITECHPAY_API_KEY}

# Pas de documentation d'API publique en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.billetplus: INFO
    org.hibernate.SQL: WARN
